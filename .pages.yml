media:
  input: src/images/blog
  output: /images/blog

content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{primary}.md"

    view:
      primary: title
      fields:
        - title
        - category
        - pubDate
        - dateModified
        - featured
      sort: pubDate
      order: desc

    fields:
      - name: title
        label: Article title
        type: string
        required: true

      - name: seoTitle
        label: SEO title
        type: string
        required: true
        description: Title used in search results and browser metadata.

      - name: description
        label: Meta description
        type: text
        required: true
        description: Search and social description.

      - name: category
        label: Category
        type: string
        required: true

      - name: image
        label: Hero image
        type: image
        required: true

      - name: imageAlt
        label: Image alt text
        type: string
        required: true
        description: Describe the image for accessibility and search.

      - name: pubDate
        label: Publication date
        type: date
        required: true

      - name: dateModified
        label: Last modified
        type: date
        required: true

      - name: lead
        label: Excerpt
        type: text
        required: true
        description: Short excerpt used on blog cards and listing pages.

      - name: relatedSlugs
        label: Related articles
        type: string
        list: true
        description: Enter each related article slug without /blog/ or .md.

      - name: featured
        label: Featured article
        type: boolean
        default: false

      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
