media:
  input: public/blog
  output: /blog

content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{primary}.md"

    view:
      primary: title
      fields:
        - title
        - category
        - pubDate
        - dateModified
        - featured
        - draft
      sort: pubDate
      order: desc

    fields:
      - name: title
        label: Article title
        type: string
        required: true

      - name: seoTitle
        label: SEO title
        type: string
        required: true
        description: Title used in search results and browser metadata.

      - name: description
        label: Article description
        type: text
        required: true
        description: Visible summary used on blog cards and listing pages.

      - name: metaDescription
        label: SEO meta description
        type: text
        required: true
        description: Search-focused description used in page metadata.

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - AI Governance & Workforce Risk
            - Legislation & Policy
            - Disclosure & Measurement
            - Women, Work & Leadership
            - CFO Insights

      - name: image
        label: Hero image
        type: image
        required: true

      - name: imageAlt
        label: Image alt text
        type: string
        required: true
        description: Describe the image for accessibility and search.

      - name: pubDate
        label: Publication date
        type: date
        required: true

      - name: dateModified
        label: Last modified
        type: date
        required: true

      - name: lead
        label: Excerpt
        type: text
        required: true
        description: Short excerpt used on article pages and promotional displays.

      - name: relatedSlugs
        label: Related articles
        type: string
        list: true
        description: Enter each related article slug without /blog/ or .md.

      - name: featured
        label: Featured article
        type: boolean
        default: false

      - name: draft
        label: Draft
        type: boolean
        default: true
        description: Keep enabled until the article is ready to publish.

      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
