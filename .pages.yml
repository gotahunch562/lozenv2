media:
  input: public/blog
  output: /blog

content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename:
      template: "{slug}.md"
      field: create

    view:
      primary: title
      fields:
        - title
        - category
        - pubDate
        - dateModified
        - featured
        - draft
      sort: pubDate
      order: desc

    fields:
      - name: title
        label: Article title
        type: string
        required: true

      - name: seoTitle
        label: SEO title
        type: string
        required: true
        description: Title used in search results and browser metadata.

      - name: slug
        label: URL slug
        type: string
        required: true
        description: Stable article URL. Use lowercase letters, numbers, and hyphens only.
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: "Use lowercase letters, numbers, and hyphens only."
      - name: description
        label: Article description
        type: text
        required: true
        description: Visible summary used on blog cards and listing pages.

      - name: metaDescription
        label: SEO meta description
        type: text
        required: true
        description: Search-focused description used in page metadata.

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - AI Governance & Workforce Risk
            - Legislation & Policy
            - Disclosure & Measurement
            - Women, Work & Leadership
            - CFO Insights

      - name: image
        label: Hero image
        type: image
        required: true

      - name: imageAlt
        label: Image alt text
        type: string
        required: true
        description: Describe the image for accessibility and search.

      - name: pubDate
        label: Publication date
        type: date
        required: true

      - name: dateModified
        label: Last modified
        type: date
        required: true

      - name: lead
        label: Excerpt
        type: text
        required: true
        description: Short excerpt used on article pages and promotional displays.

      - name: featured
        label: Featured article
        type: boolean
        default: false

      - name: draft
        label: Draft
        type: boolean
        default: true
        description: Keep enabled until the article is ready to publish.

      - name: jsonLd
        label: Article structured data
        type: object
        description: Optional JSON-LD enrichment for AI and accountability articles.
        fields:
          - name: type
            label: Article schema type
            type: select
            default: Article
            options:
              values:
                - Article
                - TechArticle

          - name: keywords
            label: Schema keywords
            type: string
            list: true
            description: Use terms that are visibly discussed in the article.

          - name: definedTerm
            label: Authoritative definition
            type: object
            description: Use only when this URL is the authoritative definition page.
            fields:
              - name: name
                label: Term name
                type: string
                required: true

              - name: alternateName
                label: Alternate term name
                type: string

              - name: description
                label: Exact visible definition
                type: text
                required: true
                description: Copy the definition stated visibly in the article.

              - name: url
                label: Canonical term URL override
                type: string
                description: Leave blank to use the current article URL.

          - name: about
            label: Canonical topics
            type: object
            list: true
            fields:
              - name: type
                label: Entity type
                type: select
                default: DefinedTerm
                options:
                  values:
                    - DefinedTerm
                    - Organization
                    - Person
                    - Thing

              - name: name
                label: Entity name
                type: string
                required: true

              - name: url
                label: Canonical URL
                type: string
                required: true

              - name: alternateName
                label: Alternate name
                type: string

              - name: description
                label: Description
                type: text

          - name: mentions
            label: Mentioned entities
            type: object
            list: true
            description: Add only organizations, people, or terms visibly mentioned in the article.
            fields:
              - name: type
                label: Entity type
                type: select
                default: Organization
                options:
                  values:
                    - Organization
                    - Person
                    - DefinedTerm
                    - Thing

              - name: name
                label: Entity name
                type: string
                required: true

              - name: url
                label: Canonical URL
                type: string

              - name: alternateName
                label: Alternate name
                type: string

              - name: description
                label: Description
                type: text

      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
